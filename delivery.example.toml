# 納品ごとの設定
# このファイルを delivery.toml（または delivery_202612.toml など）にコピーして使う。
# 相対パスはこのファイルの場所を基準にする。Windows のパスは '...'（シングルクォート）で囲むと \ をそのまま書ける。

[delivery]
name = "2026年12月納品"
# 管理表やバックアップを置く作業フォルダ
work_dir = 'work\2026-12'

# 案件ごとにプロジェクトルートを指定する
[[projects]]
name = "案件A"                       # 納品先・Teams でのフォルダ名
root = 'C:\work\案件A'
# processes = ["030", "040"]         # 対象工程を絞る場合のみ指定（省略時はフォルダがある工程すべて）
# allow_multiple = ["機能設計書"]    # 同じ工程に複数あってよいドキュメント（config.toml の documents の name）。重複の警告を出さない

[[projects]]
name = "案件B"
root = 'C:\work\案件B'
processes = ["060", "070", "080", "090"]
