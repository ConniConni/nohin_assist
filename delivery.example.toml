# 納品ごとの設定
# このファイルを delivery.toml（または delivery_202612.toml など）にコピーして使う。
# 相対パスはこのファイルの場所を基準にする。Windows のパスは '...'（シングルクォート）で囲むと \ をそのまま書ける。

[delivery]
name = "2026年12月納品"
# 管理表やバックアップを置く作業フォルダ
work_dir = 'work\2026-12'
# 納品先のフォルダ（納品ごとに新しく作る）。この下に <案件名>\<工程フォルダ>\ の構成でコピーする。
# 書かなければ deliver（納品コピー）は使えないが、collect・report はこれまでどおり動く。
# dest_root = '\\server\share\納品\2026-12'

# 案件ごとにプロジェクトルートを指定する
[[projects]]
name = "案件A"                       # 納品先・Teams でのフォルダ名
root = 'C:\work\案件A'
# processes = ["030", "040"]         # 対象工程を絞る場合のみ指定（省略時はフォルダがある工程すべて）

[[projects]]
name = "案件B"
root = 'C:\work\案件B'
processes = ["060", "070", "080", "090"]
