# 納品サポートツール 共通設定（ルールブック）
# このファイルを config.toml という名前でコピーして使う。
#
# 命名パターンは Python の正規表現。
# - 判定の前にファイル名を NFKC 正規化するので、全角の（）や全角数字は半角として扱われる。
#   パターンは半角の () で書けばよい（正規表現では \( \) と書く）。
# - 1つの種別に複数のパターンを並べられる（命名規則の移行期間用）。上から順に試す。

[layout]
# 工程フォルダ名のパターン。先頭3桁が工程番号になる
process_dir_pattern = '^(\d{3})\.'
# この名前のフォルダの下はすべて対象外（大文字小文字は区別しない）
excluded_dirs = ["back"]
# レビュー記録表・チェックリストを置くフォルダ
deliverable_dir = "成果物"
# 成果物の下のフォルダ名 → 社内外
review_dirs = { "内部Rv" = "社内", "外部Rv" = "社外" }
# レビューフォルダの下の日付フォルダ（パターン2）
date_dir_pattern = '^\d{8}$'
# 一覧に出さないファイル（Excel の一時ファイルなど）
ignore_patterns = ['^~\$', '^\.', '^Thumbs\.db$', '^desktop\.ini$']

[stamp]
# 押印者の既定値（管理表で行ごとに変更できる。Step 4 の押印で使う）
handler = ""        # 対応者: 行ごとの自社印（捺印(自社)）の名前
approver = ""       # 承認者: 社内レビュー記録表の承認欄の名前
company_name = ""

# ---- レビュー記録表の中身の読み取り ----
# 見出し・記号は NFKC 正規化と空白除去をしてから完全一致で比べる（全角・半角の括弧や記号は区別しない）。
[review_table]
finding_labels = ["指摘事項", "指摘内容"]          # 指摘の列
action_labels = ["処置欄", "処置内容"]              # 処置の列
date_labels = ["日付", "処置日"]                    # 処置の日付の列（処置の列より右で最も近いもの）
self_stamp_labels = ["捺印(自社)", "自社印"]        # 行ごとの自社印の列（処置の列より右で最も近いもの）
partner_stamp_labels = ["捺印(取引先)", "取引先印"]  # 行ごとの取引先印の列（なくてもよい）
no_labels = ["No.", "No", "NO.", "番号"]            # 指摘の番号の列（表示用。なくてもよい）
approval_labels = ["承認"]                          # 承認欄のラベル。この下のセルが承認印の枠
not_required_marks = ["-", "ー", "―", "‐", "−", "—", "─"]  # 捺印欄にこれがあれば「捺印不要」の行
no_finding_marks = ["指摘なし", "以下余白"]          # 指摘事項がこれなら指摘として数えない
blank_stop_rows = 5                                 # 空行がこの数だけ続いたら表の終わりとみなす
header_search_rows = 200                            # 見出し行を探す範囲（各シートの先頭からの行数）

# ---- 工程の対応表 ----
# code: 工程番号 / folder: フォルダ名 / cl_name: チェックリスト上の工程名 / rv_name: レビュー記録表上の工程名
[[processes]]
code = "030"
folder = "030.調査"
cl_name = "調査"
rv_name = "調査"

[[processes]]
code = "040"
folder = "040.設計"
cl_name = "設計"
rv_name = "設計"

[[processes]]
code = "050"
folder = "050.製造"
cl_name = "CD"
rv_name = "CD"

[[processes]]
code = "060"
folder = "060.UD作成"
cl_name = "UD仕様書"
rv_name = "UD作成"

[[processes]]
code = "070"
folder = "070.UD消化"
cl_name = "UD結果"
rv_name = "UD消化"

[[processes]]
code = "080"
folder = "080.SD作成"
cl_name = "SD仕様書"
rv_name = "SD作成"

[[processes]]
code = "090"
folder = "090.SD消化"
cl_name = "試験結果報告書"
rv_name = "試験結果報告書"

# ---- ドキュメント（工程フォルダ直下） ----
# self_stamp: 自社捺印が必要か / partner_stamp: 取引先捺印が必要か
[[documents]]
process = "030"
name = "調査検討書"
patterns = ['^(調査検討書|調査)_.+\.xlsx$']
self_stamp = false
partner_stamp = false

[[documents]]
process = "040"
name = "機能設計書"
patterns = ['^機能設計書_.+\.xlsx$']
self_stamp = true
partner_stamp = true

[[documents]]
process = "060"
name = "単体試験仕様書"
patterns = ['^単体試験仕様書_.+\.xlsx$']
self_stamp = true
partner_stamp = false

[[documents]]
process = "070"
name = "単体試験成績書"
patterns = ['^単体試験成績書_.+\.xlsx$']
self_stamp = true
partner_stamp = false

[[documents]]
process = "080"
name = "結合試験仕様書"
patterns = ['^結合試験仕様書_.+\.xlsx$']
self_stamp = true
partner_stamp = true

[[documents]]
process = "090"
name = "結合試験成績書"
patterns = ['^結合試験成績書_.+\.xlsx$']
self_stamp = true
partner_stamp = true

[[documents]]
process = "090"
name = "試験結果報告書"
patterns = ['^試験結果報告書_.+\.xlsx$']
self_stamp = true
partner_stamp = true

# ---- レビュー記録表（成果物/内部Rv・外部Rv の下） ----
# 必須の名前付きグループ: side（社内/社外）, round（回数の数字）, pname（工程名）
[review_record]
patterns = ['^レビュー記録表\((?P<side>社内|社外)\)\((?P<round>\d+)回目\)_(?P<pname>[^_]+)_.*\.xlsx$']
self_stamp = true
partner_stamp_sides = ["社外"]

# ---- レビューチェックリスト（成果物/内部Rv・外部Rv の下） ----
# 必須の名前付きグループ: code（工程番号）, pname（工程名）, side, round
[checklist]
patterns = ['^(?P<code>\d{3})_レビューチェックリスト_(?P<pname>[^_()]+)\((?P<side>社内|社外)\)\((?P<round>\d+)回目\)_.*\.xlsx$']
self_stamp = false
partner_stamp_sides = []
